<section>
    <h2>Choferes</h2>

    <div class="tabla">
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Estado</th>
                    <th>Licencia</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Corregido el x-for con la sintaxis limpia de Alpine -->
                <template x-for="chofer in choferes" :key="chofer.clave">
                    <tr>
                        <td x-text="chofer.nombre"></td>
                        <td x-text="chofer.apellido"></td>
                        <td x-text="chofer.estado"></td>
                        <td x-text="chofer.licencia"></td>
                        <td>
                            <button @click="editar('choferes', chofer)">
                                Editar
                            </button>
                            <!-- Asegúrate de mandar el parámetro que tu función en app.js espere -->
                            <button @click="c_borrar(chofer.clave)">
                                Eliminar
                            </button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <!-- Mensaje condicional si no hay choferes -->
    <p x-show="choferes.length === 0">No hay choferes registrados</p>

    <!-- Título dinámico para el formulario -->
    <h3 x-text="editando && editando.choferes === null ? 'Agregar Chofer' : 'Editar Chofer'"></h3>

    <form class="formulario" @submit.prevent="guardar_chofer()">
        <label>
            Nombre
            <input required x-model.trim="formChofer.nombre">
        </label>

        <label>
            Apellido
            <input x-model.trim="formChofer.apellido">
        </label>

        <label>
            Licencia
            <input x-model.trim="formChofer.licencia">
        </label>

        <label>
            Estado
            <select x-model="formChofer.estado">
                <option value="activo">Activo</option>
                <option value="inactivo">Inactivo</option>
            </select>
        </label>

        <button type="submit" :disabled="guardando">Guardar Chofer</button>

        <button type="button" @click="cancelar('choferes')">
            Cancelar
        </button>
    </form>
</section>
