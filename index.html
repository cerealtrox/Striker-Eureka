<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Fletes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    <link rel="stylesheet" href="general.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="contexto()" x-init="principal_fletes()">

    <header>
        <h1>Fletes</h1>
        <nav>
            <button @click="vista = 'Inicio'">Dashboard</button>
            <button @click="vista = 'Choferes'">Choferes</button>
            <button @click="vista = 'Unidades'">Unidades</button>
            <button @click="vista = 'Fletes'">Nuevo Flete</button>
        </nav>
    </header>

    <main>
        <section x-show="vista === 'Inicio'">
            <h2>Dashboard Principal</h2>
            <p>Fletes en Tránsito</p>
        </section>
        
        <section x-show="vista === 'Choferes'">
            <h2>Catálogo de Choferes</h2>
        </section>

        <section x-show="vista === 'Unidades'">
            <h2>Catálogo de Unidades</h2>
        </section>

        <section x-show="vista === 'Fletes'">
            <h2>Registro de Fletes</h2>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
