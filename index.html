<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Fletes</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
	<link rel="stylesheet" href="general.css">
	<script defer src="https://cdn.jsdelivr.net/npm/@shaun/alpinejs-router@1.3.5/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="app.js"></script>
</head>
<body>
	<div id="app" x-data="contexto" x-init="principal_fletes">
			<header>
				<h1>Fletes.com</h1>
				<nav>
					<a x-link href = "/"> Inicio </a>
					<a x-link href = "/unidades"> Todas las unidades </a>
					<a x-link href = "/nuevaunidad"> Agregar unidad </a>
					<a x-link href = "/choferes"> Todos los choferes  </a>
					<a x-link href = "/nuevo_flete"> Crear nuevo Flete </a>
				</nav>
			</header>

			<main>
				<template x-route="/">
					<p>Hola Soy el Index</p>
				</template>

				<template x-route="/unidades" template="/unidades.html">
				</template>

				<template x-route="/nuevaunidad" template="/nuevaunidad.html">
				</template>

				<template x-route="/choferes" template="/choferes.html">
				</template>

				<template x-route="/nuevo_flete" template="/nuevo_flete.html">
				</template>
			</main>
		</div>
</body>
</html>
